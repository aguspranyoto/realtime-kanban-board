  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: trello-clone-backend
    ports:
      - "8082:8080"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: trello-clone-web
    ports:
      - "3009:3000"
    env_file:
      - ./web/.env
    depends_on:
      - backend
    restart: unless-stopped

